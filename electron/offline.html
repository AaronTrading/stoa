<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <title>STOA Académie — Hors connexion</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:#1d241c;color:#f4f1e8;font:16px/1.6 "Segoe UI",Arial,sans-serif}.panel{width:min(520px,100%);padding:46px;border:1px solid #465044;border-radius:30px;background:#283126;box-shadow:0 26px 80px #0005;text-align:center}.mark{width:82px;height:82px;object-fit:contain;margin-bottom:22px}.eyebrow{margin:0 0 12px;color:#bfc8b6;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 14px;font:500 clamp(32px,6vw,50px)/1.08 Georgia,serif}p{margin:0 auto 28px;max-width:390px;color:#d2d7cc}button{min-height:50px;padding:0 24px;border:0;border-radius:999px;background:#f4f1e8;color:#263024;font:700 14px "Segoe UI",Arial,sans-serif;cursor:pointer}button:hover{background:#fff}
  </style>
</head>
<body>
  <main class="panel">
    <img class="mark" src="../dist/assets/branding/stoa-mark-400.png" alt="STOA">
    <p class="eyebrow">Académie STOA</p>
    <h1>Connexion interrompue.</h1>
    <p>L’application retrouvera votre session dès que l’accès à Internet sera disponible.</p>
    <button type="button" onclick="window.stoaDesktop.retry()">Réessayer</button>
  </main>
</body>
</html>
