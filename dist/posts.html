<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Les publications de la communauté STOA."><title>Posts — Communauté STOA</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><script src="env.js"></script><script type="module" src="auth.js"></script><script type="module" src="community-notifications.js"></script><script type="module" src="academy-shell.js"></script><script type="module" src="posts.js"></script></head>
<body class="member-page posts-page"><a class="skip" href="#main">Aller au contenu</a>
<header class="site-header"><a class="logo" href="/"><img class="site-logo-image" src="/assets/branding/fondtransparent.png" alt="STOA"></a></header>
<main class="posts-main" id="main">
  <header class="posts-heading"><div><span class="eyebrow">PUBLICATIONS</span><h1>Communauté</h1><p>Des idées, des questions et des réussites pour apprendre ensemble.</p></div><nav class="community-mode-nav" aria-label="Sections de la communauté"><a class="active" href="/posts">Posts</a><a href="/communaute">Chat</a></nav></header>
  <nav class="post-filters" id="post-filters" aria-label="Filtrer les publications"><button class="active" data-post-filter="all">Tous</button><button data-post-filter="announcement">Annonces</button><button data-post-filter="discussion">Discussions</button><button data-post-filter="question">Questions</button><button data-post-filter="success">Réussites</button><button data-post-filter="resource">Ressources</button></nav>
  <section class="post-composer" id="post-composer" hidden><div><span class="eyebrow">PUBLICATION ÉDITORIALE</span><h2>Partager avec la communauté</h2></div><form id="post-form"><select id="post-category" aria-label="Catégorie"><option value="announcement">Annonce</option><option value="discussion">Discussion</option><option value="question">Question</option><option value="success">Réussite</option><option value="resource">Ressource</option></select><input id="post-title" maxlength="160" placeholder="Titre de la publication" required><textarea id="post-content" maxlength="6000" rows="5" placeholder="Écrivez votre publication…" required></textarea><label class="post-image-upload" for="post-image"><span aria-hidden="true">＋</span><strong>Ajouter une image</strong><small>JPG, PNG ou WebP · 8 Mo maximum</small><input id="post-image" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="post-image-preview" id="post-image-preview" hidden><img alt="Aperçu de l’image sélectionnée"><button type="button" id="post-image-remove" aria-label="Retirer l’image">×</button></div><div><label><input id="post-pinned" type="checkbox"> Épingler dans la communauté</label><button class="button dark" type="submit">Publier <span>→</span></button></div><p id="post-form-status" role="status"></p></form></section>
  <section class="posts-feed" id="posts-feed" aria-live="polite"><div class="posts-loading"><i></i><span>Ouverture du fil…</span></div></section>
</main>
<dialog class="post-thread-dialog" id="post-thread-dialog"><button class="auth-close" id="post-thread-close" type="button" aria-label="Fermer">×</button><div id="post-thread-content"></div><form id="post-comment-form"><textarea id="post-comment-content" maxlength="2000" rows="3" placeholder="Ajouter une réponse…" required></textarea><button class="button dark" type="submit">Répondre <span>→</span></button><p id="post-comment-status" role="status"></p></form></dialog>
</body></html>
