<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="La communauté éducative STOA."><title>Communauté — STOA</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><script src="env.js"></script><script type="module" src="auth.js"></script><script type="module" src="community-notifications.js"></script><script type="module" src="academy-shell.js"></script><script type="module" src="posts.js"></script></head>
<body class="member-page posts-page"><a class="skip" href="#main">Aller au contenu</a>
<header class="site-header"><a class="logo" href="/"><img class="site-logo-image" src="/assets/branding/fondtransparent.png" alt="STOA"></a></header>
<main class="posts-main" id="main">
  <header class="posts-heading"><div><span class="eyebrow">COMMUNAUTÉ STOA</span><h1>Apprendre ensemble.</h1><p>Les publications de STOA et les sujets ouverts par les membres, dans un fil unique.</p></div><nav class="community-mode-nav" aria-label="Sections de la communauté"><a class="active" href="/posts">Fil</a><a href="/communaute">Discussion</a></nav></header>
  <nav class="post-filters" id="post-filters" aria-label="Filtrer les publications"><button class="active" data-post-filter="all">À la une</button><button data-post-filter="announcement">Annonces</button><button data-post-filter="discussion">Discussions</button><button data-post-filter="question">Questions</button><button data-post-filter="success">Réussites</button><button data-post-filter="resource">Ressources</button></nav>
  <section class="post-composer" id="post-composer" hidden><div><span class="eyebrow" id="post-composer-eyebrow">NOUVEAU SUJET</span><h2>Ouvrir une discussion</h2><p>Posez une question ou partagez une expérience avec l’Académie.</p></div><form id="post-form"><select id="post-category" aria-label="Catégorie"><option value="discussion">Discussion</option><option value="question">Question</option><option value="success">Réussite</option><option value="resource">Ressource</option><option value="announcement" data-admin-only hidden>Annonce</option></select><input id="post-title" maxlength="160" placeholder="Titre du sujet" required><textarea id="post-content" maxlength="6000" rows="5" placeholder="Écrivez votre message…" required></textarea><label class="post-image-upload" for="post-image"><span aria-hidden="true">＋</span><strong>Ajouter une image</strong><small>JPG, PNG ou WebP · 8 Mo maximum</small><input id="post-image" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="post-image-preview" id="post-image-preview" hidden><img alt="Aperçu de l’image sélectionnée"><button type="button" id="post-image-remove" aria-label="Retirer l’image">×</button></div><div><label id="post-editorial-wrap" hidden><input id="post-editorial" type="checkbox"> Publication officielle STOA</label><label id="post-pinned-wrap" hidden><input id="post-pinned" type="checkbox"> Épingler dans la communauté</label><button class="button dark" type="submit">Publier <span>→</span></button></div><p id="post-form-status" role="status"></p></form></section>
  <section class="posts-feed" id="posts-feed" aria-live="polite"><div class="posts-loading"><i></i><span>Ouverture du fil…</span></div></section>
</main>
<dialog class="post-thread-dialog" id="post-thread-dialog"><button class="auth-close" id="post-thread-close" type="button" aria-label="Fermer">×</button><div id="post-thread-content"></div><form id="post-comment-form"><div class="post-comment-composer-wrap"><textarea id="post-comment-content" maxlength="2000" rows="3" placeholder="Ajouter une réponse… Utilisez @ pour mentionner un membre." required></textarea><div class="mention-suggestions post-mention-suggestions" id="post-mention-suggestions" role="listbox" hidden></div></div><button class="button dark" type="submit">Répondre <span>→</span></button><p id="post-comment-status" role="status"></p></form></dialog>
</body></html>
